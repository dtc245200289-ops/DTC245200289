global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: mysql
    static_configs:
      - targets: ["wp_mysql_exporter:9104"]

  - job_name: nginx_https
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["https://demo.local"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: wp_blackbox_exporter:9115
